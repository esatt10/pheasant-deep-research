name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Schemas are not stale
        run: uv run python scripts/export_schemas.py --check-clean

      # Deliberately unfiltered: the whole suite, on every change. Narrowing
      # this to a curated list of "relevant" tests is the same staleness one
      # level down - the list is maintained by whoever last remembered to.
      - name: Tests
        run: uv run pytest -q

      # The demo is the integration test a person runs, so CI runs it too, and
      # `verify` is what decides whether the artifacts hold together. It exits
      # non-zero on a finding - including an INCOMPLETE gate verdict, which is
      # expected against the mock region - so its output is reported rather
      # than gating the build.
      - name: Offline demo, end to end
        run: |
          uv run pheasant-lab demo --config configs/demo.yaml --output-root runs || true
          RUN=$(ls -1d runs/run-* | tail -1)
          echo "### Demo run \`$(basename "$RUN")\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^```yaml$/,/^```$/p' "$RUN/reports/summary.md" | sed '1d;$d' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The console's UI is a separate build; a type error in it is a broken
      # console, so it is checked on every change like the Python is.
      - name: Console UI typechecks and builds
        run: |
          cd ui
          npm ci
          npm run build

      - name: Upload the demo run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-run
          path: runs/
          retention-days: 7

  # The Docker deployment: the image builds, the console in it starts and
  # refuses to serve beyond loopback without a key, and both Compose files
  # resolve. The bundled region's own image is pheasant-kb's to build; the
  # wiring between the two is held by tests/unit/test_docker_deployment.py.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compose files resolve
        env:
          PHEASANT_API_TOKEN: ci-region-token
          PHEASANT_LAB_CONSOLE_TOKEN: ci-console-token
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.fleet.yml config --quiet

      - name: Build the lab image
        run: docker build -t pheasant-swarm-lab:ci .

      - name: The console starts with a key and refuses without one
        run: |
          if docker run --rm pheasant-swarm-lab:ci; then
            echo "the console served 0.0.0.0 with no key" && exit 1
          fi
          docker run -d --name lab -p 127.0.0.1:8770:8770 \
            -e PHEASANT_LAB_CONSOLE_TOKEN=ci-console-token pheasant-swarm-lab:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8770/api/auth && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8770/api/runs)" = 401
          curl -fsS -H 'Authorization: Bearer ci-console-token' \
            -H 'content-type: application/json' -X POST http://127.0.0.1:8770/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"lab_describe_settings","arguments":{"key":"experiment.cost_budget_usd"}}}' \
            | grep -q 'hard dollar ceiling'
          docker logs lab
          docker rm -f lab
