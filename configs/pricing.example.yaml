# Versioned local pricing, in USD per 1,000,000 tokens.
#
# `version` is the edition of the prices runs are held to: bump it when a
# price changes. Adding a model does not need a bump - a run digests only the
# prices of the models it uses, so a new entry moves no existing run.
#
# A model that is not listed here fails preflight when
# `pricing.fail_when_model_price_missing` is true, which is the default: a
# model treated as free is a budget guard that does not exist.
version: 2026-09-01
currency: USD
unit: per_million_tokens

models:
  # The offline deterministic provider. Genuinely free, and declared so
  # explicitly rather than by omission.
  "replay:orchestrator": { input: 0.0, output: 0.0 }
  "replay:researcher": { input: 0.0, output: 0.0 }
  "replay:specialist": { input: 0.0, output: 0.0 }
  "replay:test-agent": { input: 0.0, output: 0.0 }
  "replay:control": { input: 0.0, output: 0.0 }
  "replay:benchmark": { input: 0.0, output: 0.0 }

  # OpenAI GPT-6 family, Standard tier, checked 2026-10-07 against OpenAI's
  # announced rates as relayed by OpenRouter, Requesty and the launch
  # coverage (openai.com itself was not reachable from where this was
  # written - re-check https://openai.com/api/pricing/ before a large run).
  #
  #   gpt-6.1-sol  successor to gpt-6-sol, same base price. Reasoning effort
  #                low|medium|high|xhigh|max (default medium); it rejects
  #                none and minimal.
  #   gpt-6-sol    reasoning effort none|low|medium|high|xhigh|max.
  #   gpt-6-luna   reasoning effort none|low|medium|high|xhigh|max.
  #
  # What the budget guard does not model, deliberately conservative or not
  # applicable here: cached-input discounts (Sol $0.10-0.20, Luna $0.01 per
  # million - the guard reserves the full input rate, an overestimate);
  # Batch/Flex at half price (the lab does not use them); Fast mode at 2x (it
  # does not request it); and the long-context rate, 2x input and 1.5x output
  # for a whole request over 272,000 input tokens - the lab's prompts are a few
  # thousand tokens, nowhere near it. Reasoning tokens bill as output, and the
  # guard reserves a call's full max_output_tokens, so they are covered.
  "gpt-6.1-sol": { input: 2.00, output: 10.00 }
  "gpt-6-sol": { input: 2.00, output: 10.00 }
  "gpt-6-luna": { input: 0.10, output: 0.50 }

  # Anthropic Claude 5.5 family, first-party API, checked 2026-10-08 against
  # Anthropic's published rates (re-check https://www.anthropic.com/pricing
  # before a large run).
  #
  #   claude-opus-5-5    effort low|medium|high|xhigh|max (default medium);
  #                      thinking cannot be turned off, so none is refused.
  #   claude-sonnet-5-5  effort none|low|medium|high|xhigh|max (default high).
  #   claude-haiku-5-5   effort none|low|medium|high|xhigh|max (default medium).
  #
  # What the budget guard does not model: cache-read discounts (the lab sends
  # no cache_control, so nothing is cached); Batch at half price and Fast mode
  # at 2x (the lab requests neither); and Haiku 5.5's long-prompt rate, $0.50
  # input and $2.50 output for a prompt over 100,000 tokens - the lab's prompts
  # are a few thousand tokens, nowhere near it. Thinking bills as output and
  # comes out of the same max_tokens the guard reserves, so it is covered.
  "claude-opus-5-5": { input: 4.00, output: 20.00 }
  "claude-sonnet-5-5": { input: 2.00, output: 10.00 }
  "claude-haiku-5-5": { input: 0.10, output: 0.50 }
